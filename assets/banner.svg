<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#181335"/>
    </linearGradient>

    <!-- Animated Neon Orb Gradients -->
    <radialGradient id="glowIndigo" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowPink" cx="70%" cy="70%" r="65%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.30"/>
      <stop offset="65%" stop-color="#db2777" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowCyan" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#0891b2" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>

    <!-- Filter for drop shadow -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonPill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.25"/>
    </filter>

    <style>
      .font-sans {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      
      /* Subtle Dynamic Animations */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes beamSlide {
        0% { stroke-dashoffset: 1000; }
        100% { stroke-dashoffset: -1000; }
      }

      .glow-orb-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 250px 140px;
      }
      .glow-orb-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: 950px 220px;
      }
      .floating-pill-1 {
        animation: floatSlow1 7s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatSlow2 8.5s ease-in-out infinite;
      }
      .floating-pill-3 {
        animation: floatSlow3 6.5s ease-in-out infinite;
      }
      .streamer {
        stroke-dasharray: 80, 200;
        animation: beamSlide 14s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16"/>

  <!-- Subtle High-tech Grid Pattern -->
  <g stroke="#334155" stroke-opacity="0.16" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="120" y1="0" x2="120" y2="380" />
    <line x1="280" y1="0" x2="280" y2="380" />
    <line x1="440" y1="0" x2="440" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="760" y1="0" x2="760" y2="380" />
    <line x1="920" y1="0" x2="920" y2="380" />
    <line x1="1080" y1="0" x2="1080" y2="380" />
  </g>

  <!-- Animated Glowing Atmosphere Orbs (in background) -->
  <circle class="glow-orb-1" cx="220" cy="110" r="190" fill="url(#glowIndigo)"/>
  <circle class="glow-orb-2" cx="980" cy="240" r="220" fill="url(#glowPink)"/>
  <circle cx="600" cy="180" r="170" fill="url(#glowCyan)"/>

  <!-- Dynamic Glowing Tech Lines -->
  <path class="streamer" d="M -50 90 Q 300 20 600 90 T 1250 90" fill="none" stroke="url(#accentGrad)" stroke-width="2.5" opacity="0.65"/>
  <path class="streamer" d="M -50 310 Q 400 370 750 310 T 1250 280" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.45"/>

  <!-- Background Animated Accent Badges / Floating Micro-Cards (spaced safely away from main text) -->
  <g class="floating-pill-1" opacity="0.78">
    <g transform="translate(60, 48)">
      <rect width="160" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-opacity="0.4" filter="url(#neonPill)"/>
      <circle cx="20" cy="17" r="4" fill="#38bdf8"/>
      <text x="34" y="22" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">Headless CMS</text>
    </g>
  </g>

  <g class="floating-pill-2" opacity="0.75">
    <g transform="translate(980, 52)">
      <rect width="165" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-opacity="0.4" filter="url(#neonPill)"/>
      <circle cx="20" cy="17" r="4" fill="#a855f7"/>
      <text x="34" y="22" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">Git-Backed CMS</text>
    </g>
  </g>

  <g class="floating-pill-3" opacity="0.72">
    <g transform="translate(50, 275)">
      <rect width="180" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#34d399"/>
      <text x="34" y="22" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">Visual Page Builder</text>
    </g>
  </g>

  <g class="floating-pill-1" opacity="0.75">
    <g transform="translate(970, 280)">
      <rect width="175" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-opacity="0.4"/>
      <circle cx="20" cy="17" r="4" fill="#f43f5e"/>
      <text x="34" y="22" fill="#94a3b8" font-size="12" font-weight="600" class="font-sans">GraphQL &amp; REST APIs</text>
    </g>
  </g>

  <!-- FOREGROUND HERO CONTENT (Unobscured & High-Contrast) -->
  <!-- Top Category Chip -->
  <g transform="translate(480, 55)">
    <rect width="240" height="32" rx="16" fill="url(#cardGrad)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.5"/>
    <text x="120" y="21" fill="#c7d2fe" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle" class="font-sans">⚡ AWESOME LIST 2026</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="800" letter-spacing="-0.8" filter="url(#shadowGlow)" class="font-sans">
    Awesome Web Content Authoring
  </text>

  <!-- Subtitle -->
  <text x="600" y="190" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="500" letter-spacing="0.2" class="font-sans">
    Curated SaaS Platforms, Open-Source Headless CMS &amp; Git-Backed Markdown Authoring Tools
  </text>

  <!-- Accent Divider Bar -->
  <rect x="520" y="215" width="160" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Bottom Feature Pill Badges -->
  <g transform="translate(240, 240)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="165" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="82" y="25" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600" class="font-sans">🗄️ Database-First</text>

    <!-- Pill 2 -->
    <rect x="180" y="0" width="175" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="267" y="25" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="600" class="font-sans">📝 Markdown &amp; Git</text>

    <!-- Pill 3 -->
    <rect x="370" y="0" width="170" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="455" y="25" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600" class="font-sans">🎨 Visual Builders</text>

    <!-- Pill 4 -->
    <rect x="555" y="0" width="165" height="40" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
    <text x="637" y="25" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600" class="font-sans">☁️ Scalable APIs</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
